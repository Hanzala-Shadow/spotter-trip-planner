name: Demo preflight
on:
  workflow_dispatch:
  push:
    branches: [submission-prep, 'preflight/**']
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run demo:preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-preflight
          path: test-results/demo-preflight/
          retention-days: 7
